services:
  - type: web
    name: codemind-ide-backend
    runtime: python
    buildCommand: pip install fastapi uvicorn[standard] google-genai python-dotenv pydantic httpx RestrictedPython radon
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: MAX_EXECUTION_TIMEOUT
        value: "10"
      - key: MAX_EXECUTION_STEPS
        value: "500"
    autoDeploy: true
